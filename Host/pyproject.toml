[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dda-host"
version = "0.1.0"
description = "Python control and monitoring client for the DDA firmware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pyserial",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
