[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dda-competition"
version = "0.1.0"
description = "Interface minimale pour la compétition DDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pyserial",
]

[tool.setuptools.packages.find]
where = ["src"]
